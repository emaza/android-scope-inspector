name: Build

on:
  push:
    branches: [main, dev, 'fase-*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a una PR o a una rama fase-* cancela la ejecución anterior. Nunca se cancela
# main ni dev: el guard y la release de cada fusión tienen que terminar.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/fase-') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.versionName }}
      is_release: ${{ steps.version.outputs.isRelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # el cálculo de versión necesita el historial y los tags

      - name: Test repo scripts
        run: |
          bash scripts/test-compute-version.sh
          bash scripts/test-check-pr-merge.sh
          bash scripts/test-pre-push-hook.sh
          bash scripts/test-test-summary.sh

      - name: Compute version
        id: version
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash scripts/compute-version.sh
          {
            echo "### Versión de esta compilación"
            echo
            echo "- Versión: \`$(grep -m1 '^versionName=' "$GITHUB_OUTPUT" | cut -d= -f2-)\`"
            echo "- Build (versionCode): \`$BUILD_NUMBER\`"
            echo "- Rama: \`$BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      # Usa el wrapper del repo (gradle/wrapper); la acción valida además el checksum del gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6

      # Robolectric descarga ~200 MB de android-all en cada ejecución si no se cachean.
      - name: Cache Robolectric android-all
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Unit tests, lint and debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: >
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --continue
          "-PappVersionName=$VERSION_NAME" "-PappVersionCode=$VERSION_CODE"

      # También cuando algo falla: es justo cuando hace falta el informe.
      - name: Test and lint summary
        if: always()
        run: python3 -I scripts/test-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ steps.version.outputs.versionName }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          retention-days: 14
          if-no-files-found: warn

      - name: Verify APK version
        env:
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          APK="scope-inspector-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -m1 '^package:')
          echo "$badging"
          for expected in "name='io.github.emaza.scopeinspector'" "versionCode='${VERSION_CODE}'" "versionName='${VERSION_NAME}'"; do
            if [[ "$badging" != *"$expected"* ]]; then
              echo "::error::El APK no contiene $expected"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: scope-inspector-${{ steps.version.outputs.versionName }}
          path: scope-inspector-*.apk
          if-no-files-found: error

  # main y dev solo deben cambiar mediante pull request. En un repositorio privado con cuenta
  # gratuita GitHub no puede bloquear el push directo, así que se detecta a posteriori
  # (ver docs/decisiones.md, flujo de ramas y PR). No revierte nada: marca el push en rojo.
  guard:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the push comes from a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-pr-merge.sh

  # Solo las pushes a main que suben la versión y proceden de una PR publican tag y GitHub Release:
  # un push directo a main (guard en rojo) no publica nada.
  release:
    needs: [build, guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: scope-inspector-${{ needs.build.outputs.version }}

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: >
          gh release create "$TAG" scope-inspector-*.apk
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$TAG" --generate-notes
